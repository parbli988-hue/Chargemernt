<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<title>Zone Aczion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0c}
body{font-family:'Inter','Segoe UI',Arial,sans-serif;color:#e8e8e8;-webkit-user-select:none;user-select:none}

/* fond : mêmes réglages que le F4 / Échap */
#bgs{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden}
#bgs div{position:absolute;left:0;top:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:0;
 -webkit-filter:saturate(.9) brightness(.95) blur(2px);filter:saturate(.9) brightness(.95) blur(2px);
 -webkit-transform:scale(1.03);transform:scale(1.03);-webkit-transition:opacity 1.6s ease;transition:opacity 1.6s ease}
#bgs div.on{opacity:1}
#veil{position:absolute;left:0;top:0;right:0;bottom:0;background:
 radial-gradient(ellipse at 50% 45%, rgba(8,8,10,.15), rgba(8,8,10,.7) 80%),
 linear-gradient(180deg, rgba(8,8,10,.6) 0%, rgba(8,8,10,.15) 30%, rgba(8,8,10,.15) 60%, rgba(8,8,10,.75) 100%)}

/* barre du haut */
.nav{position:absolute;top:30px;left:48px;right:48px;height:52px;display:flex;align-items:center;gap:34px}
.brand{display:flex;align-items:center;gap:12px;height:30px;padding-right:32px;border-right:1px solid rgba(255,255,255,.1);font-size:12px;letter-spacing:5px;font-weight:500;color:#8d8d8d;white-space:nowrap}
.brand svg{width:34px;height:34px}
.brand b{color:#fff;font-weight:600}
.nav .st{color:#fff;letter-spacing:.2em;font-weight:600;font-size:12.5px;position:relative;padding:8px 0}
.nav .st:after{content:"";position:absolute;left:0;bottom:-6px;width:100%;height:2px;border-radius:2px;background:#fff}
.nav .clock{margin-left:auto;color:#8d8d8d;letter-spacing:.2em;font-weight:600;font-size:12.5px}

/* titre */
.head{position:absolute;top:128px;left:48px;width:640px}
.eyebrow{font-size:11px;letter-spacing:5px;color:#8d8d8d;font-weight:500}
.title{font-size:34px;font-weight:700;color:#fff;letter-spacing:-.3px;margin-top:10px}
.subtitle{margin-top:6px;font-size:14px;color:#9a9a9a}

/* cartes */
.box{border-radius:12px;background:rgba(18,18,20,.55);border:1px solid rgba(255,255,255,.1);overflow:hidden}
.box .hd{padding:15px 18px;font-size:12px;letter-spacing:4px;font-weight:600;color:#fff;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.box .hd:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;opacity:.8}
.box .bd{padding:10px}

/* chargement */
.load{position:absolute;left:48px;bottom:30px;width:560px}
.load .bd{padding:16px 18px 18px}
.stline{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;color:#fff}
.stline span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.stline .pc{color:#8d8d8d;font-weight:500;font-variant-numeric:tabular-nums}
.track{margin-top:12px;height:4px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.fill{height:100%;width:0;border-radius:999px;background:#fff;opacity:.85;-webkit-transition:width .35s ease;transition:width .35s ease}
.file{margin-top:10px;font-size:12px;color:#8d8d8d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:15px}

/* colonne de droite */
.side{position:absolute;top:128px;right:48px;width:340px}
.side .box{margin-bottom:18px}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);margin-bottom:6px}
.row:last-child{margin-bottom:0}
.row .nm{flex:1;min-width:0;font-weight:600;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sb{font-size:12px;color:#8d8d8d;white-space:nowrap}
.badge{height:22px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;font-size:10px;letter-spacing:1.5px;font-weight:600;background:rgba(245,197,107,.12);color:#f5c56b}
.donors{max-height:300px;overflow:hidden}

/* rappel */
.tip{position:absolute;right:48px;bottom:30px;width:340px}
.tip .bd{padding:14px 18px 16px;font-size:13.5px;line-height:1.5;color:#b0b0b0;min-height:64px;-webkit-transition:opacity .4s;transition:opacity .4s}
.footer{position:absolute;left:50%;bottom:34px;-webkit-transform:translateX(-50%);transform:translateX(-50%);color:#5d5d5d;font-size:11px;letter-spacing:4px;font-weight:500;white-space:nowrap}
</style></head><body>
<div id="bgs"></div><div id="veil"></div>

function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function txt(i,t){$(i).innerHTML=esc(t)}

var h="",i;
for(i=0;i<EQUIPE.length;i++) h+='<div class="row"><div class="nm">'+esc(EQUIPE[i])+'</div></div>';
$("team").innerHTML=h; h="";
for(i=0;i<DONATEURS.length;i++) h+='<div class="row"><div class="nm">'+esc(DONATEURS[i])+'</div></div>';
$("donors").innerHTML=h||'<div class="row"><div class="nm">Merci à tous !</div></div>';

// fonds
var B=$("bgs"),els=[],k=0;
for(i=0;i<FONDS.length;i++){var d=document.createElement("div");d.style.backgroundImage="url('"+FONDS[i]+"')";B.appendChild(d);els.push(d)}
if(els.length){els[0].className="on";setInterval(function(){els[k].className="";k=(k+1)%els.length;els[k].className="on"},8000)}

// rappels
var r=0;
function nextTip(){var e=$("tip");e.style.opacity=0;setTimeout(function(){e.innerHTML=esc(RAPPELS[r]);e.style.opacity=1;r=(r+1)%RAPPELS.length},400)}
nextTip();setInterval(nextTip,6500);

// horloge
function tick(){var d=new Date();function z(n){return(n<10?"0":"")+n}txt("clock",z(d.getHours())+":"+z(d.getMinutes()))}
tick();setInterval(tick,5000);

// ===== appelé par Garry's Mod =====
var total=0,needed=0,map="",maxp="";
function sub(){var s=[];if(map)s.push(map);if(maxp)s.push(maxp+" places");txt("ssub",s.join("  ·  ")||"Préparation de ta session…")}
function prog(){if(total>0){var p=Math.floor((total-needed)/total*100);if(p<0)p=0;$("fill").style.width=p+"%";txt("pct",p+" %")}}
function GameDetails(servername,serverurl,mapname,maxplayers,steamid,gamemode){
  if(servername)txt("sname",servername); map=mapname||""; maxp=maxplayers||""; sub();
}
function SetFilesTotal(t){total=t;prog()}
function SetFilesNeeded(n){needed=n;prog()}
function DownloadingFile(f){txt("file",f);needed=Math.max(0,needed-1);prog()}
